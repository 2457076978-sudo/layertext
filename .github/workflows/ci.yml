name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: 类型检查 + 全量测试 + 评测 + 双引擎对照
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖（根）
        run: npm ci

      - name: 版本对齐门禁（四处版本一致，漂移即失败）
        run: node tools/check_versions.mjs

      - name: Lint（ESLint 静态检查，0 error 门禁）
        run: npm run lint

      - name: 构建 + 类型检查 + 全量测试
        run: npm test

      - name: 金标准评测（不低于质量基线，低于则失败）
        run: npm run eval

      - name: 双引擎对照（TS vs Python 参照版）
        run: node dist/tools/compare.js

      - name: 桌面应用类型检查
        run: |
          cd app
          npm ci
          npx tsc --noEmit -p tsconfig.json

  # Rust 主进程单独一个 job：它是 macOS 专有的（security / open / say / TCC），
  # 塞不进 ubuntu 那个 job。而它是**最会丢数据的一层**（文件读写、原子写、钥匙串），
  # 长期只在开发者本机跑过——2026-09-14 之前 CI 里根本没有 cargo 这一步。
  rust:
    name: Rust 主进程门禁（fmt / clippy / 单测）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check / clippy -D warnings / test
        run: npm run verify:rust
