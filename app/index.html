<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LayerText 分层读</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #6b7280;
      --line: #e5e7eb;
      --brand: #2f6fed;
      --oov: #d64541;
      --pending: #e8862e;
      --term: #2f6fed;
      --riskbg: #fdecea;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg); color: var(--ink); font-size: 14px;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    header {
      background: var(--panel); border-bottom: 1px solid var(--line);
      padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    }
    header .logo { font-weight: 700; font-size: 16px; margin-right: 8px; }
    header .logo small { color: var(--muted); font-weight: 400; margin-left: 6px; }
    button {
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    }
    button:hover { border-color: var(--brand); color: var(--brand); }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    button.primary:hover { opacity: 0.9; }
    #status { width: 100%; color: var(--muted); font-size: 12px; padding-top: 2px; }
    nav.tabs { display: flex; gap: 4px; padding: 8px 16px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
    nav.tabs button { border: none; border-radius: 8px 8px 0 0; padding: 8px 16px; color: var(--muted); background: transparent; }
    nav.tabs button.active { color: var(--brand); font-weight: 600; box-shadow: inset 0 -2px 0 var(--brand); }
    main { flex: 1; overflow: hidden; padding: 16px; }
    section.pane { height: 100%; overflow: auto; display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px 32px; }
    section.pane.active { display: block; }
    .empty { color: var(--muted); text-align: center; margin-top: 80px; line-height: 2; }

    /* 正文渲染 */
    .para { margin-bottom: 14px; line-height: 2.05; font-size: 16px; }
    .pid {
      display: inline-block; font-size: 11px; color: var(--muted);
      border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 8px; vertical-align: 1px;
    }
    .sent { padding: 1px 2px; border-radius: 4px; }
    .sent.risk { background: var(--riskbg); }
    .badge { color: var(--oov); font-size: 10px; margin-left: 2px; cursor: default; }
    .w { position: relative; display: inline-block; }
    .w::after {
      content: ''; position: absolute; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 50%; bottom: -2px;
    }
    .w.oov { color: var(--oov); }
    .w.oov::after { background: var(--oov); }
    .w.pending::after { background: var(--pending); }
    .w.term::after { background: var(--term); }

    /* 报告 */
    table.report { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
    table.report th, table.report td { border: 1px solid var(--line); padding: 7px 12px; text-align: left; font-size: 13px; }
    table.report th { background: #fafbfc; width: 40%; color: var(--muted); font-weight: 500; }
    .oov-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { background: #fef2f2; color: var(--oov); border: 1px solid #fecaca; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
    .saved-path { color: var(--muted); font-size: 12px; margin: 8px 0 16px; word-break: break-all; }
    .legend { display: flex; gap: 18px; color: var(--muted); font-size: 12px; margin: 0 0 14px; flex-wrap: wrap; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
    label.tier { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 4px; }
    select { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <span class="logo">LayerText 分层读<small>v0.1 · 自动质检</small></span>
    <button id="btn-demo">载入示例</button>
    <button id="btn-open">打开章节文件…</button>
    <button id="btn-vocab">自定义词库 CSV…（可选）</button>
    <button id="btn-terms">术语表 TXT…（可选）</button>
    <label class="tier">层级
      <select id="tier">
        <option value="M" selected>M（中梯）</option>
        <option value="B">B（支架）</option>
        <option value="A">A（挑战）</option>
      </select>
    </label>
    <button id="btn-run" class="primary">▶ 开始质检</button>
    <div id="status">请打开一个章节文件（或点「载入示例」）。内置课标 2022 三级 1600 词表已就绪。</div>
  </header>

  <nav class="tabs">
    <button id="tab-text" class="active">正文</button>
    <button id="tab-report">质检报告</button>
  </nav>

  <main>
    <section id="pane-text" class="pane active">
      <div class="legend">
        <span><i class="dot" style="background:var(--oov)"></i>词表外（红）</span>
        <span><i class="dot" style="background:var(--pending)"></i>待定词（橙）</span>
        <span><i class="dot" style="background:var(--term)"></i>术语（蓝）</span>
        <span><i class="dot" style="background:var(--riskbg);border:1px solid #f5c6c2"></i>风险句（超长/被动/定从/过去完成）</span>
      </div>
      <div id="reader"><div class="empty">尚未载入文本<br/>点击上方「载入示例」或「打开章节文件…」</div></div>
    </section>
    <section id="pane-report" class="pane">
      <div class="empty">尚未运行质检</div>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
